version: 2

# All updates (NuGet packages and GitHub Actions, including major versions) are combined into one weekly pull request
# with a single commit, so dependency updates create as few commits as possible.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"

updates:
  # NuGet packages of all projects
  - package-ecosystem: "nuget"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
