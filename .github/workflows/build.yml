name: Build & Release

# Pull requests: build only, the executables are attached to the run as artifacts.
# Push to main: build with the next version number, then create the tag and a GitHub release with the executables.
# Dependabot pull requests: merged automatically if everything is green, then released (job dependabot-merge).
on:
  push:
    branches: [ main ]
    # changes that don't affect the executable don't create a release
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.idea/**'
      - '.github/**'
  pull_request:
    branches: [ main ]
    # workflow changes (e.g. Dependabot updates of actions) are still tested in PRs
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.idea/**'
  workflow_dispatch:

# Releases are queued so two pushes in quick succession can't compute the same version.
# Outdated PR builds are cancelled instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      # tag of the next release (e.g. v1.2.3); empty for pull requests and if the commit is already tagged
      tag: ${{ steps.version.outputs.new_tag }}

    steps:
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0     # full history + tags, needed to determine the next version

      - name: Determine next version
        id: version
        if: github.event_name != 'pull_request'
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch  # use #minor or #major in the commit message for bigger steps
          DRY_RUN: true        # only calculate, the tag is created together with the release

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          # test: run the tests (they depend on the file system, e.g. case sensitivity)
          - os: windows-latest
            rid: win-x64
            test: true
          - os: ubuntu-latest
            rid: linux-x64
            test: true
          - os: macos-latest   # Apple Silicon runner
            rid: osx-arm64
            test: true
          - os: macos-latest   # Intel build, cross-compiled on the Apple Silicon runner (tests already run above)
            rid: osx-x64
            test: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json  # same SDK version as for local builds

      - name: Test
        if: matrix.test
        run: dotnet test --configuration Release

      - name: Check API key
        # releases must contain the API key; PR builds (e.g. from forks or Dependabot) don't get secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Repository secret TMDB_API_KEY is missing"
            exit 1
          fi

      - name: Publish
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}  # embedded into the executable, see EmbeddedTmdbApiKey.targets
        run: |
          version_args=()
          if [ -n "$TAG" ]; then
            version_args=("-p:Version=${TAG#v}")   # embedded into the executable (file and product version)
          fi
          dotnet publish src/MediaRenamer \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            "${version_args[@]}" \
            --output publish

      # Windows: a .zip with MediaRenamer.exe.
      # Linux/macOS: a .tar.gz with MediaRenamer, so the executable permission survives the download.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path publish/MediaRenamer.exe -DestinationPath dist/MediaRenamer-${{ matrix.rid }}.zip
          Get-ChildItem dist

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          tar -czf dist/MediaRenamer-${{ matrix.rid }}.tar.gz -C publish MediaRenamer
          ls -l dist

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: MediaRenamer-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    needs: [ version, build ]
    # tag is empty for pull requests and if the commit is already tagged (e.g. manual re-run)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write  # create tag and release

    steps:
      - name: Download executables
        uses: actions/download-artifact@v8
        with:
          pattern: MediaRenamer-*
          merge-multiple: true
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  # Dependabot updates are merged automatically when all builds and tests passed. "Squash and merge" because GitHub
  # signs that commit and the history stays linear. A merge with the GITHUB_TOKEN does not trigger the push event, so
  # the release is started explicitly via workflow_dispatch (the only event the GITHUB_TOKEN may trigger), unless the
  # update only changes files that don't create a release on push (see paths-ignore above, e.g. GitHub Actions).
  dependabot-merge:
    name: Merge Dependabot update
    needs: build
    # only runs started by Dependabot itself, not by someone pushing to its branch
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write       # merge
      pull-requests: write  # merge
      actions: write        # start the release

    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --match-head-commit: only the tested state is merged, not a commit pushed in the meantime
        run: gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA"

      - name: Start release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          relevant=$(gh pr diff "$PR" --name-only | grep -vE '\.md$|^LICENSE$|^\.idea/|^\.github/' || true)
          if [ -z "$relevant" ]; then
            echo "Only files that don't affect the executable changed, no release"
            exit 0
          fi
          echo "Changed files that affect the executable:"
          echo "$relevant"
          gh workflow run build.yml --ref main
